$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/idaibin/knowledge-distillation/schemas/knowledge.schema.yaml
title: Knowledge Distillation IR
description: Contract for traceable, reusable knowledge assets.
type: object
additionalProperties: false
required: [metadata, status, sources, boundary, principles, frameworks, anti_patterns, open_questions, artifact]
properties:
  metadata:
    type: object
    additionalProperties: false
    required: [id, title, domain, ir_version, created_at]
    properties:
      id: {type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"}
      title: {type: string, minLength: 1}
      domain: {type: string, minLength: 1}
      ir_version: {const: "0.1"}
      created_at: {type: string, format: date}
  status:
    type: object
    additionalProperties: false
    required: [maturity]
    properties:
      maturity: {enum: [draft, reviewed, validated, executable]}
      reviewed_by:
        type: array
        items: {type: string, minLength: 1}
        uniqueItems: true
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, type, reference]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9._-]+$"}
        type: {enum: [book, course, article, paper, transcript, sop, experience, observation, repository, other]}
        reference: {type: string, minLength: 1}
        authors:
          type: array
          items: {type: string, minLength: 1}
        access: {enum: [public, private, licensed, internal, unknown]}
  boundary:
    type: object
    additionalProperties: false
    required: [include, exclude]
    properties:
      include: {$ref: "#/$defs/nonEmptyStrings"}
      exclude: {$ref: "#/$defs/nonEmptyStrings"}
  principles:
    type: array
    items: {$ref: "#/$defs/principle"}
  frameworks:
    type: array
    items: {$ref: "#/$defs/framework"}
  anti_patterns:
    type: array
    items: {$ref: "#/$defs/antiPattern"}
  open_questions:
    type: array
    items: {type: string, minLength: 1}
  artifact:
    type: object
    additionalProperties: false
    required: [requested_level, selected_level, rationale]
    properties:
      requested_level: {enum: [auto, level_1, level_2, level_3, level_4]}
      selected_level: {enum: [level_1, level_2, level_3, level_4]}
      rationale: {type: string, minLength: 1}
  executable:
    $ref: "#/$defs/executable"
allOf:
  - if:
      properties:
        artifact:
          properties:
            selected_level: {const: level_4}
    then:
      required: [executable]
  - if:
      properties:
        status:
          properties:
            maturity: {const: executable}
    then:
      properties:
        artifact:
          properties:
            selected_level: {const: level_4}
      required: [executable]
$defs:
  nonEmptyStrings:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
    uniqueItems: true
  evidence:
    type: object
    additionalProperties: false
    required: [type, source_ref, locator]
    properties:
      type: {enum: [citation, experience, observation, inference]}
      source_ref: {type: string, minLength: 1}
      locator: {type: string, minLength: 1}
      excerpt: {type: string}
      note: {type: string}
  principle:
    type: object
    additionalProperties: false
    required: [id, name, statement, evidence]
    properties:
      id: {type: string, pattern: "^PR-[0-9]{2,}$"}
      name: {type: string, minLength: 1}
      statement: {type: string, minLength: 1}
      evidence:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/evidence"}
  framework:
    type: object
    additionalProperties: false
    required: [id, name, problem, steps, boundaries, evidence]
    properties:
      id: {type: string, pattern: "^FW-[0-9]{2,}$"}
      name: {type: string, minLength: 1}
      problem: {type: string, minLength: 1}
      steps:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, action, check]
          properties:
            id: {type: integer, minimum: 1}
            action: {type: string, minLength: 1}
            check: {type: string, minLength: 1}
      boundaries: {$ref: "#/$defs/nonEmptyStrings"}
      evidence:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/evidence"}
  antiPattern:
    type: object
    additionalProperties: false
    required: [id, name, symptom, correction, evidence]
    properties:
      id: {type: string, pattern: "^AP-[0-9]{2,}$"}
      name: {type: string, minLength: 1}
      symptom: {type: string, minLength: 1}
      correction: {type: string, minLength: 1}
      evidence:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/evidence"}
  executable:
    type: object
    additionalProperties: false
    required: [trigger, inputs, workflow, outputs, constraints, validation]
    properties:
      trigger:
        type: object
        additionalProperties: false
        required: [when, do_not_trigger_when]
        properties:
          when: {$ref: "#/$defs/nonEmptyStrings"}
          do_not_trigger_when: {$ref: "#/$defs/nonEmptyStrings"}
      inputs:
        type: object
        additionalProperties: false
        required: [required, optional]
        properties:
          required: {$ref: "#/$defs/nonEmptyStrings"}
          optional:
            type: array
            items: {type: string, minLength: 1}
      workflow:
        type: object
        additionalProperties: false
        required: [steps]
        properties:
          steps: {$ref: "#/$defs/nonEmptyStrings"}
      outputs:
        type: object
        additionalProperties: false
        required: [format, required_sections]
        properties:
          format: {type: string, minLength: 1}
          required_sections: {$ref: "#/$defs/nonEmptyStrings"}
      constraints: {$ref: "#/$defs/nonEmptyStrings"}
      validation:
        type: object
        additionalProperties: false
        required: [tests]
        properties:
          tests:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [name, input, expected_behavior]
              properties:
                name: {type: string, minLength: 1}
                input: {type: string, minLength: 1}
                expected_behavior: {$ref: "#/$defs/nonEmptyStrings"}

