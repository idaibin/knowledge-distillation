original_story:
  title: 那块玻璃之后的两个空位
  setting: 一间原创街角装裱店；店主林岚原计划用两个预算袋替成年助手换鞋并添置参考书。
  beats:
    - {card: 1, function: shock, action: 一块飞石打破唯一临街窗；唯一一双磨损鞋始终穿在助手双脚，地面不得另放鞋，左预算袋直接贴近助手脚上鞋；右预算袋直接放在大尺寸无字空心单本书轮廓计划板下方或旁侧，两组明显分离且不可彼此成组；计划板中心完全镂空透出连续空墙，只表示未发生的购书计划。画面移除整座书架、所有实体书与书状物、墙框和矩形背景面。}
    - {card: 2, function: visible_spending, action: 玻璃工陈默带来新窗片，林岚把两个无字预算袋移到修窗托盘。}
    - {card: 3, function: unseen_substitutes, action: 修窗后旧鞋仍在，预留书架仍空；鞋与书没有发生，只是原计划。}
    - {card: 4, function: resource_transfer, action: 陈默带走两个预算袋，店内助手把旧鞋放在空鞋盒旁；书计划位改用一块大尺寸无字空心书形占位板表示未购，镂空处可见背景且不是实际书。}
    - {card: 5, function: mistaken_net_gain, action: 陈默只在唯一临街窗表面做现场清洁与封边，两名邻居共同注视这处附着式忙碌；林岚同时指向旧鞋和空书位，拒绝把支出直接算作净收益。}
    - {card: 6, function: counterfactual_boundary, action: 众人并列查看两个无字情景板，并把假设卡留在两板之间而不选定必然结果。}
    - {card: 7, function: procedural_close, action: 复核者分开摆放碎玻璃证据、鞋书替代图块与假设卡，只确认分析步骤。}
