global_negative_prompt:
  - 任何文字、汉字、英文字母、数字、价格、货币符号、logo或水印
  - 法槌、法袍、法院徽记、警徽、胜负奖牌、对错勾叉或普遍结论式图示
  - 课程案件的原人物、原物件、散落物聚集、马车或历史法庭场景
  - 教师讲台、商务西装、英雄构图、幼态人物、恋爱暗示
  - 额外同类工具箱、吊牌、木牌、自行车、零件托盘、圆形硬币或重复人物

