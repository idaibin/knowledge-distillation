  description: 成熟半写实编辑插画，自然成人比例，克制表情，轻纸张与丝网印刷质感。
  palette: [深海军蓝, 陶土红, 暖黄, 暖白, 低饱和蓝灰]
characters:
  a_heng: 较高偏瘦的年轻成年男性，短微卷黑发，深海军蓝外套，浅色内搭，无胡须无眼镜。
  xiao_he: 略矮的年轻成年女性，深色低发髻与清晰侧分，陶土红上衣，暖白下装。
  relationship: 平等朋友；两人都能观察、犯错、提出条件、改变主意，不构成老师与学生。
rule_media:
  first_tag: 天然木牌，只有手掌触碰吊牌的无字木刻图示；无数字、货币、对错符号或法律徽记。
  complete_and_handover: 天然木牌，只有扳手、圆形检验印与交接双手的无字木刻图示；圆印无文字且不可像硬币。
  interpretation_limit: 仅表示试行条件、责任和证明入口，不表示价格、判决、现行法或普遍结论。
