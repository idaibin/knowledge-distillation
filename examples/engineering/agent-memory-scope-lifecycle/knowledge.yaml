anti_patterns:
  - id: AP-01
    name: Transcript as memory
    symptom: Every message or checkpoint is copied into long-term retrieval without a purpose, scope, expiry, or sensitive-data filter.
    correction: Classify storage roles, extract only durable facts, and retain raw content only under an explicit policy.
    evidence:
      - type: citation
        source_ref: mem0
        locator: "commit 760dca6f391277d79c3c7d2096c1bf1d037526c3; path docs/core-concepts/how-it-works.mdx; blob 55cc2c1cf1985e1dd6b7d62e30929115bc856589; ## Messages vs memories; ## Two phases: extraction and retrieval"
        verification_status: source_supported
  - id: AP-02
    name: Scope-free recall
    symptom: A search omits identity filters or silently widens them when no result is found.
    correction: Require caller-provided identity keys and reject missing or invalid scope parameters.
    evidence:
      - type: citation
        source_ref: mem0
        locator: "commit 760dca6f391277d79c3c7d2096c1bf1d037526c3; path mem0/memory/main.py; blob 4aac8f8e55f4a19d87687839c5d5b0ca85346f9a; symbol:_IDENTITY_KEYS; symbol:_validate_search_params"
        verification_status: source_supported
  - id: AP-03
    name: Deletion claim without readback
    symptom: An application reports memory forgotten after a delete call without checking indexes, backups, or subsequent scoped retrieval.
    correction: Perform post-forgetting readback and backend-specific audit; keep erasure not_verified when semantics are unknown.
    evidence:
      - type: inference
        source_ref: mem0
        locator: "commit 760dca6f391277d79c3c7d2096c1bf1d037526c3; path docs/core-concepts/how-it-works.mdx; blob 55cc2c1cf1985e1dd6b7d62e30929115bc856589; ## Where memories live"
        verification_status: unverified
        note: Readback and backup audit are local lifecycle controls; the cited source does not prove deletion semantics.
open_questions:
  - Which stores hold copies of a memory and what are their deletion, tombstone, backup, and index-compaction semantics?
  - What retention and forgetting policy applies to each workflow state, transcript, and durable-memory scope?
  - Have cross-scope, sensitive-field, stale-fact, and deletion fixtures passed for the chosen Mem0 and LangGraph configuration?
artifact:
  requested_level: level_3
  selected_level: level_3
  rationale: This Level 3 draft combines fixed-source capability and boundary descriptions with an ordered local method independently verified only against a fixed mock/fixture oracle. It does not prove a real memory runtime, classifier, storage isolation, or production behavior and is not Level 4 or a Skill.
  render_targets: [model, framework]
