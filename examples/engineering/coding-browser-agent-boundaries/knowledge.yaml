anti_patterns:
  - id: AP-01
    name: Mount or profile means permission
    symptom: A mounted repository, active browser profile, or available API key is treated as authorization to read or mutate everything reachable.
    correction: Enumerate workspace/profile/network/credential scope and require target-specific approval before mutation.
    evidence:
      - type: citation
        source_ref: openhands-openhands
        locator: "commit=2feab551c4c12130c126159e1a0bd56753e2968f; path=README.md; blob=973cbf183baa9a25e4d17bb09679b45baa82d668; locator=#architecture"
        verification_status: source_supported
  - id: AP-02
    name: Constructor controls equal safety
    symptom: max_failures, timeout, task, tools, or browser session arguments are cited as proof that the agent is isolated or safe.
    correction: Verify runtime enforcement, budget exhaustion, profile/domain boundaries, and denied adjacent actions; otherwise mark unverified.
    evidence:
      - type: citation
        source_ref: browser-use-browser-use
        locator: "commit=f0aa3a8bb03779c71a5aa262d389e3bfe6b77cdc; path=browser_use/agent/service.py; blob=4bee7b6dffe9c45fec47740a6e5326a2c1dd534f; locator=symbol:Agent"
        verification_status: source_supported
  - id: AP-03
    name: Diff or browser success equals completion
    symptom: A generated diff, form submission, or success message is accepted without targeted tests/DOM assertion, receipt, and authority cleanup.
    correction: Require independent postcondition evidence and revoke temporary authority; report unknown when any proof is missing.
    evidence:
      - type: inference
        source_ref: openhands-openhands
        locator: "commit=2feab551c4c12130c126159e1a0bd56753e2968f; path=__tests__/api/runtime-service/agent-server-runtime-service.test.ts; blob=e37bdb3b653220fbdf1e7d38d69b704983e00feb; locator=describe(\"AgentServerRuntimeService.executeCommand\""
        verification_status: unverified
        note: The pinned tests are mocked and were not run; they do not prove a real postcondition or receipt.
open_questions:
  - Which workspace, browser profile, domain, and credential broker enforce target-specific authorization at runtime?
  - What immutable receipt format binds a code diff or DOM mutation to the approved run and postcondition?
  - Which revocation and cleanup probes are reliable for local and hosted agent modes?
artifact:
  requested_level: level_3
  selected_level: level_3
  rationale: This Level 3 draft combines fixed-source capability and boundary descriptions with an ordered local method independently verified only against a fixed mock workspace/DOM fixture oracle. It does not prove a real browser, workspace, provider, credential, sandbox, or production behavior and is not Level 4 or a Skill.
  render_targets: [model, framework]
