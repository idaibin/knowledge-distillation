usage:
  purpose: product_development
  visibility: public
  source_retention: transformed_notes
  publication_review: required
  publication_constraints: [no_source_text, no_source_substitute_positioning]
  notes: Fixed upstream sources plus an already run local mock/fixture observation support this draft; real provider, runtime, MCP, memory, backend, telemetry, browser, filesystem, and production behavior remain unverified.
boundary:
  include:
    - Distinguishing a direct vector/query-engine RAG path from graph extraction and community-report paths
    - Measuring retrieval coverage, answer faithfulness, and query relevance before changing architecture
    - Piloting GraphRAG only when query structure and evidence gaps justify its extra indexing work
  exclude:
    - Universal quality, cost, latency, or security claims for either architecture
    - Treating a graph with nonempty entities or relationships as factually correct
    - Replacing target-corpus evaluation with framework documentation or vendor examples
principles:
  - id: PR-01
    name: Upgrade for an evidence-shaped query need
    statement: Keep simple RAG when retrieved context can answer the target query with adequate coverage and faithfulness; consider GraphRAG when multi-hop relationships, corpus-wide synthesis, or repeated retrieval gaps are demonstrated.
    evidence:
      - type: inference
        source_ref: llama-index
        locator: "commit c864fcfa2c1d1f987ccdbcdab7b18e395c01ba86; path docs/src/content/docs/framework/getting_started/concepts.mdx; blob 6b2a4bc56bfd92552c188458ebf4c9434762139d; ## Agentic Applications; ## Agents; ## Retrieval Augmented Generation (RAG)"
        verification_status: unverified
        note: local synthesis
      - type: citation
        source_ref: graphrag
        locator: "commit 14a00ad88fc33cf2b52f4f113f25807556f8e25e; path docs/index/architecture.md; blob c5d86938fe5ac6c9ddc912072c3e25b2a2a9eafd; # Indexing Architecture; ## Knowledge Model; ## Workflows"
        verification_status: source_supported
  - id: PR-02
    name: Coverage and faithfulness are separate gates
    statement: A response should be checked both for whether relevant evidence was retrieved and for whether its claims are supported by that evidence; one score cannot stand in for the other.
    evidence:
      - type: citation
        source_ref: llama-index
        locator: "commit c864fcfa2c1d1f987ccdbcdab7b18e395c01ba86; path docs/src/content/docs/framework/module_guides/evaluating/usage_pattern.md; blob 7c07cccf6aad0a2fb9f5cc56f105e92818952cef; ## Evaluating Response Faithfulness (i.e. Hallucination); ## Evaluating Query + Response Relevancy"
        verification_status: source_supported
  - id: PR-03
    name: Graph extraction success is not answer truth
    statement: A completed graph-extraction pipeline or nonempty entities and relationships establishes pipeline output, not factual accuracy; provenance and target-corpus evaluation remain necessary.
    evidence:
      - type: citation
        source_ref: graphrag
        locator: "commit 14a00ad88fc33cf2b52f4f113f25807556f8e25e; path packages/graphrag/graphrag/index/workflows/extract_graph.py; blob dc86b180fc870a9fc8f2d456236cb8d4ec907262; run_workflow; extract_graph; get_summarized_entities_relationships"
        verification_status: source_supported
      - type: citation
        source_ref: graphrag
        locator: "commit 14a00ad88fc33cf2b52f4f113f25807556f8e25e; path RAI_TRANSPARENCY.md; blob 1a789aede716938549844fbbf74ede0646828896; ## What are the limitations of GraphRAG?"
        verification_status: source_supported
frameworks:
  - id: FW-01
    name: Retrieval-to-GraphRAG escalation gate
    problem: Decide whether a target corpus and query workload justify replacing or supplementing simple RAG with the more expensive GraphRAG indexing and synthesis path.
    steps:
      - id: 1
        action: Freeze the corpus, query classes, answer contract, provenance requirement, latency/cost envelope, and a small adjudicated test set.
        check: If no representative target-domain questions or gold/reference evidence exists, stop and label the decision not_verified.
      - id: 2
        action: Run the simplest RAG baseline and retain retrieved contexts, response, query, latency, and cost for each test item.
        check: Score retrieval coverage/relevance and response faithfulness separately; unknown or incomparable evaluator fields block an upgrade claim.
      - id: 3
        action: "Classify the residual failures: missing local passages, multi-hop relationship traversal, corpus-wide synthesis, conflicting provenance, or ordinary generation error."
        check: If failures are ordinary retrieval/chunking/query issues, tune the simple path first; proceed only when graph-shaped failures recur.
      - id: 4
        action: Estimate GraphRAG indexing inputs and cost, then pilot its extraction, embeddings, community/report generation, and provenance on the small target-domain set.
        check: Confirm entities/relationships and reports are nonempty and traceable, while treating that as pipeline readiness rather than factual validation.
      - id: 5
        action: Compare simple RAG and GraphRAG on the same questions using coverage, faithfulness, relevance, latency, indexing cost, and human provenance inspection.
        check: Choose GraphRAG only if the graph-shaped cases gain material evidence coverage/faithfulness within the accepted cost and latency envelope; otherwise retain simple RAG.
      - id: 6
        action: Record the decision, rejected alternatives, unresolved corpus risks, and a rollback path.
        check: A missing reproducible metric, human review, or target-corpus trace keeps the result provisional and blocks broad generalization.
    boundaries:
      - GraphRAG README calls the code a demonstration and warns indexing can be expensive; prompt tuning may be needed.
      - LlamaIndex evaluator examples use LLM judges and do not prove calibration on a target dataset.
      - GraphRAG guidance expects trusted users, domain-expert analysis, and provenance tracing.
      - No source here supplies a universal threshold for when GraphRAG wins.
    evidence:
      - type: citation
        source_ref: llama-index
        locator: "commit c864fcfa2c1d1f987ccdbcdab7b18e395c01ba86; path llama-index-core/llama_index/core/query_engine/retriever_query_engine.py; blob 907d391048d1d636b24ceb3c1dc0feee5e6682ed; RetrieverQueryEngine.retrieve; RetrieverQueryEngine.synthesize; RetrieverQueryEngine._query"
        verification_status: source_supported
