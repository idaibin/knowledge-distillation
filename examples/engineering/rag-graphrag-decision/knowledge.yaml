anti_patterns:
  - id: AP-01
    name: Graph novelty as justification
    symptom: A graph is introduced because it is more sophisticated, without a recurring query failure that simple RAG cannot address.
    correction: Freeze a baseline and require graph-shaped residual failures plus target-corpus evidence gains before escalation.
    evidence:
      - type: inference
        source_ref: graphrag
        locator: "commit 14a00ad88fc33cf2b52f4f113f25807556f8e25e; path README.md; blob b17d46fdaff576147051eedef932d5992392bbe7; ## Overview; ## Repository Guidance"
        verification_status: unverified
        note: The source warns of demonstration status and indexing cost; the anti-pattern correction is a local synthesis.
  - id: AP-02
    name: One evaluator number as truth
    symptom: A single relevance, coverage, or faithfulness score is used as proof of architecture superiority.
    correction: Report coverage, faithfulness, relevance, cost/latency, and human provenance inspection separately.
    evidence:
      - type: citation
        source_ref: llama-index
        locator: "commit c864fcfa2c1d1f987ccdbcdab7b18e395c01ba86; path docs/src/content/docs/framework/module_guides/evaluating/usage_pattern.md; blob 7c07cccf6aad0a2fb9f5cc56f105e92818952cef; ## Evaluating Response Faithfulness (i.e. Hallucination); ## Evaluating Query + Response Relevancy"
        verification_status: source_supported
  - id: AP-03
    name: Nonempty graph equals factual graph
    symptom: Entity and relationship rows are treated as verified facts without provenance review.
    correction: Preserve extraction provenance, inspect target-domain examples, and keep factual quality not_verified until adjudicated.
    evidence:
      - type: citation
        source_ref: graphrag
        locator: "commit 14a00ad88fc33cf2b52f4f113f25807556f8e25e; path packages/graphrag/graphrag/index/workflows/extract_graph.py; blob dc86b180fc870a9fc8f2d456236cb8d4ec907262; extract_graph; get_summarized_entities_relationships"
        verification_status: source_supported
open_questions:
  - What coverage and faithfulness thresholds are acceptable for this product's query mix and risk class?
  - Does GraphRAG improve multi-hop or global-synthesis cases after prompt tuning on the target corpus?
  - Which evaluator judge, human adjudication protocol, and provenance trace are stable enough for a repeatable comparison?
artifact:
  requested_level: level_3
  selected_level: level_3
  rationale: This Level 3 draft combines fixed-source capability and boundary descriptions with an ordered local method independently verified only against a fixed mock/fixture oracle. It does not prove a real retriever, model, runtime, target corpus, or production behavior and is not Level 4 or a Skill.
  render_targets: [model, framework]
