usage:
  purpose: product_development
  visibility: public
  source_retention: transformed_notes
  publication_review: required
  publication_constraints: [no_source_text, no_source_substitute_positioning]
  notes: Fixed upstream sources plus an already run local mock/fixture observation support this draft; real provider, runtime, MCP, memory, backend, telemetry, browser, filesystem, and production behavior remain unverified.
boundary:
  include:
    - Assigning conversation control between a manager and specialist agents
    - Guardrail timing and scope around agent and function-tool execution
    - Checkpoint, interrupt, resume, retry, and idempotency decisions for stateful runs
  exclude:
    - Claiming provider, sandbox, security, or side-effect correctness without local tests
    - Treating an interrupt or checkpoint as transactional exactly-once execution
    - Selecting a topology solely from framework feature lists
principles:
  - id: PR-01
    name: Control ownership is an explicit runtime choice
    statement: Keep a central manager when one conversation owner must coordinate specialists; use a handoff only when conversation control should move to the specialist.
    evidence:
      - type: citation
        source_ref: openai-agents-python
        locator: "commit 000a96b602889b00f7cfaa210c41e1a74be65272; path docs/agents.md; blob f5946643bb73a35ec5082351ff305bb44082d0f7; # Agents; ## Multi-agent system design patterns"
        verification_status: source_supported
  - id: PR-02
    name: Guardrail coverage follows execution boundaries
    statement: Agent-level input/output guardrails cover the first and final agents, while function-tool guardrails surround configured function-tool calls; delegated or hosted paths need separate coverage checks.
    evidence:
      - type: citation
        source_ref: openai-agents-python
        locator: "commit 000a96b602889b00f7cfaa210c41e1a74be65272; path docs/guardrails.md; blob 5caa814c3e9abdd7385bd2ac457eae7d9b859e52; # Guardrails; ## Workflow boundaries; ## Tool guardrails"
        verification_status: source_supported
  - id: PR-03
    name: Resume re-executes work unless side effects are made safe
    statement: A LangGraph interrupt resumes by re-executing the node from its start, so external effects must be idempotent or fenced independently of the checkpoint.
    evidence:
      - type: citation
        source_ref: langgraph
        locator: "commit b2926a0ff9589c28c7e01fe7cdbb337b86d5a4b4; path libs/langgraph/langgraph/types.py; blob ac9aa9b00565ec20476b4d00a3847f6b7e8fda34; symbol:interrupt"
        verification_status: source_supported
      - type: inference
        source_ref: langgraph
        locator: "commit b2926a0ff9589c28c7e01fe7cdbb337b86d5a4b4; path libs/langgraph/langgraph/types.py; blob ac9aa9b00565ec20476b4d00a3847f6b7e8fda34; symbol:interrupt"
        verification_status: unverified
        note: Idempotency fencing is a design consequence to test in the application; the source does not prove user side-effect safety.
frameworks:
  - id: FW-01
    name: Control-and-resume runtime gate
    problem: Decide who owns agent conversation control and how a run is guarded, checkpointed, interrupted, resumed, and prevented from duplicating side effects.
    steps:
      - id: 1
        action: "Write the run contract: conversation owner, specialist boundaries, allowed tools, maximum turns, approval points, and consequential side effects."
        check: If one owner must retain the conversation, choose manager-as-tools; if control must transfer, choose a handoff; if neither is explicit, stop.
      - id: 2
        action: Map every input, output, and function-tool boundary to its guardrail and timing mode.
        check: Confirm first-agent input, final-agent output, and each configured function tool are covered; if a hosted tool or handoff is uncovered, add a separate control or stop.
      - id: 3
        action: Select a persistence mode and checkpointer for runs that can pause, fail, or outlive one invocation.
        check: Confirm the chosen durability mode and checkpointer satisfy the required resume point; otherwise downgrade to a non-resumable run and disclose the loss.
      - id: 4
        action: Place interruptible approval before the consequential operation and record the state needed to resume.
        check: On resume, verify that the approval is still for the same target and arguments; reject stale or broadened approval.
      - id: 5
        action: Make every external side effect idempotent with a stable operation key, or move it after a durable approval/checkpoint boundary.
        check: Replay the resumed node against a duplicate request; if it can create a second effect or its postcondition cannot be checked, stop before enabling resume.
      - id: 6
        action: Run bounded failure drills for guardrail trip, max-turn exhaustion, checkpoint loss, timeout, interrupt, and retry.
        check: Each drill has an observable stop, refusal, or explicit degraded result; an untested path remains not_verified.
    boundaries:
      - The OpenAI Agents tests use FakeModel and do not establish real-provider safety, latency, or sandbox containment.
      - LangGraph interrupt requires a checkpointer and re-executes the node; it is not an exactly-once transaction boundary.
      - Cooperative timeout may be delayed by CPU-bound or synchronous work.
      - Persistence and memory features do not define a correct application state schema or business approval policy.
    evidence:
      - type: citation
        source_ref: openai-agents-python
        locator: "commit 000a96b602889b00f7cfaa210c41e1a74be65272; path src/agents/run.py; blob d0e3f9ee5668e4daeaf7183290739c49b98958e3; symbol:Runner.run; symbol:Runner.run_sync; symbol:AgentRunner.run_streamed"
        verification_status: source_supported
