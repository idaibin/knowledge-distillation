anti_patterns:
  - id: AP-01
    name: Guardrail illusion
    symptom: A first-agent input guardrail is treated as if it surrounds every handoff and tool call.
    correction: Enumerate execution boundaries and add function-tool or workflow-level checks for uncovered paths.
    evidence:
      - type: citation
        source_ref: openai-agents-python
        locator: "commit 000a96b602889b00f7cfaa210c41e1a74be65272; path docs/guardrails.md; blob 5caa814c3e9abdd7385bd2ac457eae7d9b859e52; ## Workflow boundaries; ## Tool guardrails"
        verification_status: source_supported
  - id: AP-02
    name: Checkpoint equals exactly once
    symptom: A resumed interrupt is allowed to repeat a payment, message, deletion, or other external write.
    correction: Use an idempotency key or durable postcondition fence and test duplicate resume before enabling the path.
    evidence:
      - type: inference
        source_ref: langgraph
        locator: "commit b2926a0ff9589c28c7e01fe7cdbb337b86d5a4b4; path libs/langgraph/langgraph/types.py; blob ac9aa9b00565ec20476b4d00a3847f6b7e8fda34; symbol:interrupt"
        verification_status: unverified
        note: The duplicate-effect correction is an application control inferred from documented node re-execution.
open_questions:
  - Which checkpointer and external-effect store provide the required durability and idempotency guarantees in the target deployment?
  - Have real-provider, timeout, cancellation, and approval-replay drills passed for the chosen graph and agent topology?
  - Which handoff or hosted-tool paths remain outside the tested guardrail envelope?
