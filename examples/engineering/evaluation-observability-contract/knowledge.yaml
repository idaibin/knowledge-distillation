anti_patterns:
  - id: AP-01
    name: Trace equals truth
    symptom: A complete-looking trace or normalized observation is reported as proof that the final answer or action was correct.
    correction: Score outcome against frozen ground truth and use traces only to diagnose process and missing evidence.
    evidence:
      - type: inference
        source_ref: langfuse-langfuse
        locator: "commit=314804b5c68d42bc742505c7b2552298bfe0ca88; path=README.md; blob=aa96cd81580a43260174793e63561d5a490055f9; locator=#core-features"
        verification_status: unverified
  - id: AP-02
    name: One score hides three axes
    symptom: Outcome, process, and security are averaged into one pass/fail and a security failure or unknown disappears.
    correction: Emit three axis records and block aggregate claims when any required axis is unknown or unsafe.
    evidence:
      - type: inference
        source_ref: deepeval
        locator: "commit=0d100e37d4263f208488f3c13e15561bce3b694f; path=deepeval/metrics/tool_use/tool_use.py; blob=6ccd80ad4dab0d4b05fa45dceab3fc01a3a091a8; locator=symbol:_get_argument_correctness_score; symbol:_get_tool_selection_score"
        verification_status: unverified
      - type: inference
        source_ref: promptfoo-promptfoo
        locator: "commit=82ca3c24ec445cf1734face46042c187b659b954; path=README.md; blob=9ffb6e9e61e099eea702427f963afa1c2b3ce7ef; locator=#what-can-you-do-with-promptfoo"
        verification_status: unverified
  - id: AP-03
    name: Planned test equals passing test
    symptom: A smoke-test matrix, CLI registration, or provider option is cited as a successful runtime evaluation.
    correction: Record command output, environment, provider/config status, and exit code; otherwise mark the axis unknown.
    evidence:
      - type: citation
        source_ref: promptfoo-promptfoo
        locator: "commit=82ca3c24ec445cf1734face46042c187b659b954; path=docs/plans/smoke-tests.md; blob=362f02183744b706aa933428556d26d2e783b535; locator=### 1. CLI Binary Tests"
        verification_status: source_supported
open_questions:
  - Which independent ground-truth and adjudication process is authoritative for each product task?
  - How are evaluator model drift, provider failures, and malformed observations represented in long-lived comparisons?
  - Which security cases and thresholds are sufficient before a rule can be promoted across heterogeneous tasks?
artifact:
  requested_level: level_3
  selected_level: level_3
  rationale: This Level 3 draft combines fixed-source capability and boundary descriptions with an ordered local method independently verified only against a fixed JSON/fixture oracle. It does not prove a real evaluator, telemetry backend, provider, security event, or production behavior and is not Level 4 or a Skill.
  render_targets: [model, framework]
