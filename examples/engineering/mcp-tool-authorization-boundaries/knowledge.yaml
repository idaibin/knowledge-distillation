anti_patterns:
  - id: AP-01
    name: Discovered means allowed
    symptom: The agent executes any tool returned by discovery or any connected endpoint without a principal, target, or per-call authorization record.
    correction: Re-run the binding and approval gates; deny if any field is missing or broader than the frozen request.
    evidence:
      - type: inference
        source_ref: composio
        locator: "commit=f1c1aa5613c2464aa8a53420d2357617a4d8bf2f; path=README.md; blob=951b2ead521096752f9df74f1b06fb97c24e53cd; locator=#Quickstart"
        verification_status: unverified
  - id: AP-02
    name: Default identity in multi-user execution
    symptom: A default or reused userId/session is used for more than one real principal or organization.
    correction: Require a stable unique production identifier and verify account scope before the call; deny on mismatch.
    evidence:
      - type: citation
        source_ref: composio
        locator: "commit=f1c1aa5613c2464aa8a53420d2357617a4d8bf2f; path=ts/docs/core-concepts.md; blob=35ae0a07d6086859d29e4f18ee582e7f551d27e5; locator=### The `default` User ID; ### Production User IDs"
        verification_status: source_supported
  - id: AP-03
    name: Success response closes the task
    symptom: A successful-looking tool response is accepted without an independent receipt, target readback, or authority revocation.
    correction: Mark the outcome unknown, attempt independent postcondition verification and revocation, and preserve unresolved side effects.
    evidence:
      - type: inference
        source_ref: mcp-servers
        locator: "commit=76d64c822f5125032f89eb71dbdb94e42b434821; path=README.md; blob=fe5351a890ab80f6d49b2b50f1e0732224313b24; locator=#Creating Your Own Server"
        verification_status: unverified
        note: The source warns reference implementations need adopter safeguards but does not specify receipt/readback/revoke behavior.
open_questions:
  - Which MCP transports and Composio session APIs expose durable receipts that can be independently read back?
  - What authorization service proves principal-to-account and target permissions in the deployment?
  - Which temporary authorities can be revoked deterministically, and how are residual external side effects reconciled?
artifact:
  requested_level: level_3
  selected_level: level_3
  rationale: This Level 3 draft combines fixed-source capability and boundary descriptions with an ordered local method independently verified only against a fixed fake-server/fixture oracle. It does not prove a real MCP server, identity provider, concurrent session, network, or production behavior and is not Level 4 or a Skill.
  render_targets: [model, framework]
