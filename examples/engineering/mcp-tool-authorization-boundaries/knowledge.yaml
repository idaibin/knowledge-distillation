        locator: "commit=76d64c822f5125032f89eb71dbdb94e42b434821; path=src/fetch/src/mcp_server_fetch/server.py; blob=b42c7b1f6b7ce1fea6b50a5a4554f3436cb36131; locator=symbol:serve"
